<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Expense Tracker</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2344/2344132.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans selection:bg-indigo-500 selection:text-white pb-10">

  <script>
    const INJECTED_GAS_URL = '__GAS_URL_PLACEHOLDER__';
    function getGasUrl() {
      if (!INJECTED_GAS_URL.includes('__GAS_URL') && INJECTED_GAS_URL.startsWith('http')) return INJECTED_GAS_URL;
      return localStorage.getItem('gas_url');
    }
  </script>

  <!-- ================= LOADING OVERLAY ================= -->
  <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm hidden items-center justify-center z-[100] transition-opacity">
    <div class="flex flex-col items-center space-y-4">
      <svg class="animate-spin h-12 w-12 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <p id="loadingText" class="text-sm font-medium text-slate-300 tracking-wide">กำลังประมวลผล...</p>
    </div>
  </div>
  <!-- =================================================== -->

  <div class="max-w-md mx-auto p-4 space-y-5">
    
    <header class="flex justify-between items-center pt-2">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white">💰 บันทึกรายรับ-รายจ่าย</h1>
        <p id="syncStatus" class="text-xs text-slate-400">พร้อมใช้งาน</p>
      </div>
      <div class="flex gap-2">
        <button onclick="fetchTransactions()" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition" title="รีเฟรชข้อมูล">🔄</button>
        <button onclick="openSettings()" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition" title="ตั้งค่า PIN">⚙️</button>
      </div>
    </header>

    <div class="space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-semibold text-slate-300">สรุปยอด</h2>
        <select id="monthFilter" onchange="renderTransactions()" class="bg-slate-800 text-xs text-white border border-slate-700 rounded-lg px-2 py-1.5 focus:outline-none focus:border-indigo-500">
          <option value="ALL">ทั้งหมด</option>
        </select>
      </div>
      
      <!-- สรุปยอด (Dark Theme, Layout ใหม่) -->
      <div class="flex flex-col items-center justify-center bg-slate-800/80 border border-slate-700/50 p-6 rounded-2xl shadow-sm mb-4">
        
        <!-- Chart -->
        <div class="relative w-36 h-36 flex-shrink-0">
          <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
            <!-- Base (สีเทาเข้มเมื่อไม่มีข้อมูล) -->
            <circle cx="18" cy="18" r="15.91549431" fill="transparent" stroke="#334155" stroke-width="3"></circle>
            <!-- Income (สีเขียว) -->
            <circle id="donutIncome" cx="18" cy="18" r="15.91549431" fill="transparent" stroke="#34d399" stroke-width="3" stroke-dasharray="0 100" stroke-dashoffset="0" class="transition-all duration-700 ease-out"></circle>
            <!-- Expense (สีแดง) -->
            <circle id="donutExpense" cx="18" cy="18" r="15.91549431" fill="transparent" stroke="#fb7185" stroke-width="3" stroke-dasharray="0 100" stroke-dashoffset="0" class="transition-all duration-700 ease-out"></circle>
          </svg>
          
          <!-- ยอดคงเหลือตรงกลาง (สีฟ้า) -->
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span id="sumBalance" class="text-3xl font-bold text-sky-400 truncate w-24 text-center">0</span>
          </div>
        </div>

        <!-- Legend ตัวเลข (จัดเรียงด้านล่าง) -->
        <div class="flex items-center justify-center gap-8 w-full mt-6">
          <div class="text-center">
            <p class="text-base font-bold text-emerald-400">รายรับ <span id="sumIncome">0</span></p>
          </div>
          <div class="text-center">
            <p class="text-base font-bold text-rose-400">รายจ่าย <span id="sumExpense">0</span></p>
          </div>
        </div>
        
      </div>
    </div>

    <form id="txForm" onsubmit="handleFormSubmit(event)" class="bg-slate-800 border border-slate-700/60 p-4 rounded-2xl space-y-4 shadow-lg">
      <div class="grid grid-cols-2 gap-2 bg-slate-900 p-1 rounded-xl">
        <button type="button" id="btnExpense" onclick="setTxType('EXPENSE')" class="py-2 rounded-lg text-sm font-semibold transition bg-rose-600 text-white shadow">รายจ่าย</button>
        <button type="button" id="btnIncome" onclick="setTxType('INCOME')" class="py-2 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white">รายรับ</button>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">หมวดหมู่</label>
          <select id="category" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"></select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">จำนวนเงิน (บาท)</label>
          <input type="number" id="amount" step="0.01" inputmode="decimal" required placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">หมายเหตุ (ไม่บังคับ)</label>
        <input type="text" id="note" placeholder="เช่น ข้าวมันไก่, ค่าน้ำมัน..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-md">บันทึกรายการ</button>
    </form>

    <div class="space-y-2.5">
      <h2 class="text-sm font-semibold text-slate-300">รายการที่บันทึก</h2>
      <div id="txList" class="space-y-2"></div>
    </div>
  </div>

  <div id="settingsModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-white">🔒 ยืนยันตัวตน</h3>
      <p class="text-xs text-slate-400 -mt-2">กรุณากรอกรหัส PIN เพื่อเข้าใช้งานระบบ</p>
      <div class="space-y-3">
        <div id="urlInputContainer" class="hidden">
          <label class="block text-xs text-slate-400 mb-1">GAS URL (Fallback Mode)</label>
          <input type="url" id="cfgUrl" placeholder="https://script.google.com/..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">รหัส PIN (API Key)</label>
          <input type="password" id="cfgKey" inputmode="numeric" placeholder="รหัส PIN ของคุณ" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-sm text-center tracking-widest text-white focus:outline-none focus:border-indigo-500 font-mono">
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="closeSettings()" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-700">ยกเลิก</button>
        <button type="button" onclick="saveSettings()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-semibold text-white">บันทึกและซิงค์</button>
      </div>
    </div>
  </div>

  <script>
    const CATEGORIES = {
      EXPENSE: ['🍔 อาหาร/เครื่องดื่ม', '🚗 เดินทาง/น้ำมัน', '🛒 ของใช้ส่วนตัว', '🏠 ค่าบ้าน/น้ำ/ไฟ', '🎮 บันเทิง/เกม', '📦 อื่นๆ'],
      INCOME: ['💼 เงินเดือน', '⚡ รายได้เสริม', '📈 เงินปันผล/ดอกเบี้ย', '🎁 อื่นๆ']
    };

    let currentType = 'EXPENSE';
    let transactions = [];

    // ======== โค้ดส่วน Loading Overlay ========
    function showLoading(text) {
      document.getElementById('loadingText').textContent = text || 'กำลังประมวลผล...';
      const overlay = document.getElementById('loadingOverlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function hideLoading() {
      const overlay = document.getElementById('loadingOverlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }
    // ==========================================

    window.addEventListener('DOMContentLoaded', () => {
      setTxType('EXPENSE');
      const cached = localStorage.getItem('tx_cache');
      if (cached) {
        transactions = JSON.parse(cached);
        updateMonthOptions();
        renderTransactions();
      }

      const url = getGasUrl();
      const key = localStorage.getItem('gas_key');
      if (!url || !key) openSettings();
      else fetchTransactions();
    });

    function setTxType(type) {
      currentType = type;
      const btnExp = document.getElementById('btnExpense');
      const btnInc = document.getElementById('btnIncome');
      if (type === 'EXPENSE') {
        btnExp.className = 'py-2 rounded-lg text-sm font-semibold transition bg-rose-600 text-white shadow';
        btnInc.className = 'py-2 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white';
      } else {
        btnInc.className = 'py-2 rounded-lg text-sm font-semibold transition bg-emerald-600 text-white shadow';
        btnExp.className = 'py-2 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white';
      }
      document.getElementById('category').innerHTML = CATEGORIES[type].map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function setStatus(text, isError = false) {
      const el = document.getElementById('syncStatus');
      el.textContent = text;
      el.className = `text-xs ${isError ? 'text-rose-400 font-medium' : 'text-slate-400'}`;
    }

    async function fetchTransactions() {
      const url = getGasUrl();
      const key = localStorage.getItem('gas_key');
      if (!url || !key) return openSettings();
      
      showLoading('กำลังซิงค์ข้อมูลล่าสุด...');
      
      try {
        const res = await fetch(`${url}?apiKey=${encodeURIComponent(key)}`, { method: 'GET', redirect: 'follow' });
        const json = await res.json();
        if (json.status === 'success') {
          transactions = json.data;
          localStorage.setItem('tx_cache', JSON.stringify(transactions));
          updateMonthOptions();
          renderTransactions();
          setStatus('ซิงค์ล่าสุด: ' + new Date().toLocaleTimeString('th-TH'));
        } else {
          setStatus('รหัส PIN ผิด หรือซิงค์ไม่สำเร็จ', true);
        }
      } catch (err) {
        setStatus('ออฟไลน์ หรือ URL ไม่ถูกต้อง', true);
      } finally {
        hideLoading();
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const url = getGasUrl();
      const key = localStorage.getItem('gas_key');
      if (!url || !key) return openSettings();

      const amountEl = document.getElementById('amount');
      const noteEl = document.getElementById('note');
      
      const newTx = {
        timestamp: new Date().toISOString(),
        type: currentType,
        category: document.getElementById('category').value,
        amount: parseFloat(amountEl.value),
        note: noteEl.value.trim()
      };

      // Optimistic Insert
      transactions.unshift(newTx);
      localStorage.setItem('tx_cache', JSON.stringify(transactions));
      updateMonthOptions();
      renderTransactions();
      
      amountEl.value = '';
      noteEl.value = '';
      
      showLoading('กำลังบันทึกข้อมูล...');

      try {
        const res = await fetch(url, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ apiKey: key, ...newTx })
        });
        const json = await res.json();
        if (json.status === 'success') setStatus('บันทึกสำเร็จ ✓');
        else setStatus('บันทึกผิดพลาด: ' + json.message, true);
      } catch (err) {
        setStatus('ส่งข้อมูลไม่สำเร็จ (เช็คอินเทอร์เน็ต)', true);
      } finally {
        hideLoading();
      }
    }

    async function deleteTx(timestampStr) {
      if (!confirm('ยืนยันการลบรายการนี้?')) return;
      const url = getGasUrl();
      const key = localStorage.getItem('gas_key');
      if (!url || !key) return openSettings();

      const backupTx = [...transactions];
      
      // Optimistic Delete
      transactions = transactions.filter(t => String(t.timestamp) !== String(timestampStr));
      localStorage.setItem('tx_cache', JSON.stringify(transactions));
      updateMonthOptions();
      renderTransactions();
      
      showLoading('กำลังลบข้อมูล...');

      try {
        const res = await fetch(url, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ apiKey: key, action: 'DELETE', timestamp: timestampStr })
        });
        const json = await res.json();
        
        if (json.status === 'success') {
          setStatus('ลบสำเร็จ ✓');
        } else {
          transactions = backupTx;
          renderTransactions();
          setStatus('ลบผิดพลาด: ' + json.message, true);
        }
      } catch (err) {
        transactions = backupTx;
        renderTransactions();
        setStatus('ลบไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ต)', true);
      } finally {
        hideLoading();
      }
    }

    function updateMonthOptions() {
      const select = document.getElementById('monthFilter');
      const currentVal = select.value;
      const monthsSet = new Set();
      
      transactions.forEach(t => {
        const d = new Date(t.timestamp);
        if(!isNaN(d)) {
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          monthsSet.add(`${y}-${m}`);
        }
      });

      let html = `<option value="ALL">ทั้งหมด</option>`;
      const monthNames = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      
      Array.from(monthsSet).sort().reverse().forEach(ym => {
        const [year, month] = ym.split('-');
        html += `<option value="${ym}">${monthNames[parseInt(month)-1]} ${year}</option>`;
      });

      select.innerHTML = html;
      
      if (Array.from(select.options).some(opt => opt.value === currentVal)) {
        select.value = currentVal;
      } else {
        select.value = (monthsSet.size > 0 && currentVal === 'ALL') ? Array.from(monthsSet).sort().reverse()[0] : 'ALL';
      }
    }

    function renderTransactions() {
      const listEl = document.getElementById('txList');
      const filterVal = document.getElementById('monthFilter').value;
      
      let filteredTx = transactions;
      if (filterVal !== 'ALL') {
        filteredTx = transactions.filter(t => {
          const d = new Date(t.timestamp);
          if (isNaN(d)) return false;
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}` === filterVal;
        });
      }

      let sumInc = 0, sumExp = 0;
      filteredTx.forEach(t => {
        const amt = Number(t.amount) || 0;
        if (t.type === 'INCOME') sumInc += amt;
        else sumExp += amt;
      });

        document.getElementById('sumIncome').textContent = sumInc.toLocaleString('th-TH');
        document.getElementById('sumExpense').textContent = sumExp.toLocaleString('th-TH');
        document.getElementById('sumBalance').textContent = (sumInc - sumExp).toLocaleString('th-TH');

        // ======== อัปเดตวิธีคำนวณ Donut Chart ใหม่ ========
        const incCircle = document.getElementById('donutIncome');
        const expCircle = document.getElementById('donutExpense');
        
        if (sumInc === 0 && sumExp === 0) {
          // 1. ยังไม่มีประวัติเลย -> กราฟเป็นสีเทา (ซ่อนเขียวและแดง)
          incCircle.setAttribute('stroke-dasharray', '0 100');
          expCircle.setAttribute('stroke-dasharray', '0 100');
        } else if (sumExp >= sumInc) {
          // 2. ขาดทุน หรือ รายจ่ายเท่ากับรายรับพอดี -> สีแดง 100% ไม่มีสีเขียว
          incCircle.setAttribute('stroke-dasharray', '0 100');
          expCircle.setAttribute('stroke-dasharray', '100 0');
          expCircle.setAttribute('stroke-dashoffset', '0');
        } else {
          // 3. มีกำไร (รายรับ > รายจ่าย) -> คำนวณสัดส่วนว่ารายจ่ายกินไปกี่ %
          const expPct = (sumExp / sumInc) * 100;
          const profitPct = 100 - expPct;
          
          // วาดสีแดงเริ่มจาก 0
          expCircle.setAttribute('stroke-dasharray', `${expPct} ${100 - expPct}`);
          expCircle.setAttribute('stroke-dashoffset', '0');
          
          // วาดสีเขียว (กำไร) ต่อท้ายพื้นที่สีแดง
          incCircle.setAttribute('stroke-dasharray', `${profitPct} ${100 - profitPct}`);
          incCircle.setAttribute('stroke-dashoffset', `-${expPct}`);
        }
        // ===============================================

      if (filteredTx.length === 0) {
        listEl.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">ไม่มีรายการในเดือนนี้</div>`;
        return;
      }

      listEl.innerHTML = filteredTx.map(t => {
        const isInc = t.type === 'INCOME';
        const dateObj = new Date(t.timestamp);
        const dateStr = isNaN(dateObj) ? '' : dateObj.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        
        return `
          <div class="flex items-center justify-between bg-slate-800/60 border border-slate-700/40 px-3.5 py-2.5 rounded-xl gap-2">
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-slate-200 truncate">${escapeHtml(t.category)} ${t.note ? `<span class="text-xs text-slate-400 font-normal">• ${escapeHtml(t.note)}</span>` : ''}</p>
              <p class="text-[11px] text-slate-500">${dateStr}</p>
            </div>
            <div class="text-sm font-bold whitespace-nowrap ${isInc ? 'text-emerald-400' : 'text-rose-400'} text-right">
              ${isInc ? '+' : '-'}${Number(t.amount).toLocaleString('th-TH')}
            </div>
            <button onclick="deleteTx('${t.timestamp}')" class="p-2 text-slate-500 hover:text-rose-400 transition rounded-lg hover:bg-slate-700/50" title="ลบรายการ">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function openSettings() {
      const hasInjectedUrl = !INJECTED_GAS_URL.includes('__GAS_URL') && INJECTED_GAS_URL.startsWith('http');
      const urlContainer = document.getElementById('urlInputContainer');
      if (!hasInjectedUrl) {
        urlContainer.classList.remove('hidden');
        document.getElementById('cfgUrl').value = localStorage.getItem('gas_url') || '';
      } else {
        urlContainer.classList.add('hidden');
      }
      document.getElementById('cfgKey').value = localStorage.getItem('gas_key') || '';
      const modal = document.getElementById('settingsModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.add('hidden');
      document.getElementById('settingsModal').classList.remove('flex');
    }

    function saveSettings() {
      const key = document.getElementById('cfgKey').value.trim();
      if (!key) return alert('กรุณากรอกรหัส PIN');
      const hasInjectedUrl = !INJECTED_GAS_URL.includes('__GAS_URL') && INJECTED_GAS_URL.startsWith('http');
      if (!hasInjectedUrl) {
        const url = document.getElementById('cfgUrl').value.trim();
        if (!url) return alert('กรุณากรอก GAS URL');
        localStorage.setItem('gas_url', url);
      }
      localStorage.setItem('gas_key', key);
      closeSettings();
      fetchTransactions();
    }
  </script>
</body>
</html>
